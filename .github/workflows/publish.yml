name: Publish to PyPI

# Publishes the package to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# Before the first release, the "trusted publisher" has to be registered on
# pypi.org for the project (owner Maarmapa, repo dashai-mcp, workflow
# publish.yml, environment pypi). See the PR that added this file.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dashai-mcp
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
